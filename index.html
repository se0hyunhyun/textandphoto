<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짤 만들기</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#2b2b2b; --accent:#ff7a59; --line:#e5e1d8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; text-align: center; }
  .desc { text-align: center; color: #777; margin: 0 0 20px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: #ddd; }
  .field { margin-top: 16px; }
  label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  textarea, input[type=text] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 16px; resize: vertical;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  input[type=color] { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: #fff; }
  .btn {
    display: block; width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 12px;
    font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; text-align: center;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: #efece4; color: var(--ink); }
  .btn:active { transform: translateY(1px); }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  .hint { font-size: 12px; color: #888; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>짤 만들기</h1>
  <p class="desc">원하는 문구를 입력하면 이미지에 자동으로 반영됩니다.</p>

  <div class="card">
    <canvas id="canvas" width="1080" height="1080"></canvas>

    <div class="field">
      <label for="text">넣을 문구</label>
      <textarea id="text" rows="2">Test message!!!</textarea>
    </div>

    <div class="field">
      <label for="size">글씨 크기 <span id="sizeVal"></span></label>
      <input id="size" type="range" min="20" max="260" value="110">
    </div>

    <div class="field">
      <label for="posY">글씨 세로 위치 <span id="posVal"></span></label>
      <input id="posY" type="range" min="0" max="100" value="82">
    </div>

    <div class="field row">
      <div>
        <label for="fill">글씨 색</label>
        <input id="fill" type="color" value="#ffffff">
      </div>
      <div>
        <label for="stroke">테두리 색</label>
        <input id="stroke" type="color" value="#000000">
      </div>
    </div>

    <label class="btn ghost" for="file">🖼 배경 사진 바꾸기</label>
    <input id="file" type="file" accept="image/*">
    <button class="btn ghost" id="reset" type="button">기본 배경으로 되돌리기</button>
    <div class="hint">내 기기의 사진이 서버로 전송되지 않고, 브라우저에서만 처리됩니다.</div>

    <button class="btn primary" id="download" type="button">PNG 이미지 만들기 · 다운로드</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const el = { text:$('text'), size:$('size'), posY:$('posY'), fill:$('fill'), stroke:$('stroke'),
               file:$('file'), reset:$('reset'), download:$('download'), sizeVal:$('sizeVal'), posVal:$('posVal') };

  let bgImage = null;          // null이면 기본 그라데이션 배경
  const MAX_SIDE = 1600;       // 업로드 이미지 최대 변 길이

  function drawBackground() {
    if (bgImage) {
      ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
    } else {
      const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      g.addColorStop(0, '#ffd9c7');
      g.addColorStop(1, '#bfe3ff');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  // 가로 폭에 맞춰 자동 줄바꿈 (입력한 줄바꿈도 유지)
  function wrapLines(text, maxWidth) {
    const out = [];
    text.split('\n').forEach(paragraph => {
      if (paragraph === '') { out.push(''); return; }
      let line = '';
      for (const ch of paragraph) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          out.push(line);
          line = ch;
        } else {
          line = test;
        }
      }
      out.push(line);
    });
    return out;
  }

  function render() {
    const scale = canvas.width / 1080;
    const fontSize = Number(el.size.value) * scale;
    el.sizeVal.textContent = el.size.value;
    el.posVal.textContent = el.posY.value + '%';

    drawBackground();

    ctx.font = `800 ${fontSize}px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, fontSize * 0.14);
    ctx.strokeStyle = el.stroke.value;
    ctx.fillStyle = el.fill.value;

    const lines = wrapLines(el.text.value, canvas.width * 0.9);
    const lineHeight = fontSize * 1.2;
    const blockH = lineHeight * lines.length;
    const centerY = canvas.height * Number(el.posY.value) / 100;
    let y = centerY - blockH / 2 + lineHeight / 2;

    lines.forEach(line => {
      ctx.strokeText(line, canvas.width / 2, y);
      ctx.fillText(line, canvas.width / 2, y);
      y += lineHeight;
    });
  }

  function loadImage(file, done) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
        canvas.width = Math.round(img.naturalWidth * ratio);
        canvas.height = Math.round(img.naturalHeight * ratio);
        bgImage = img;
        render();
        done && done();
      };
      img.onerror = () => {
        alert('이미지를 불러오지 못했어요. JPG/PNG 파일로 다시 시도해 주세요. (아이폰 HEIC 사진은 안 될 수 있어요)');
        done && done();
      };
      img.src = reader.result;
    };
    reader.onerror = () => {
      alert('파일을 읽지 못했어요. 다시 시도해 주세요.');
      done && done();
    };
    reader.readAsDataURL(file);
  }

  ['input', 'change'].forEach(evt => {
    [el.text, el.size, el.posY, el.fill, el.stroke].forEach(node => node.addEventListener(evt, render));
  });

  el.file.addEventListener('change', e => {
    const input = e.target;
    const f = input.files && input.files[0];
    if (!f) return;
    // 파일을 다 읽은 뒤에 입력값을 비워야 같은 사진도 다시 선택할 수 있음
    loadImage(f, () => { input.value = ''; });
  });

  el.reset.addEventListener('click', () => {
    bgImage = null;
    canvas.width = 1080; canvas.height = 1080;
    render();
  });

  el.download.addEventListener('click', () => {
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'meme.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  render();
})();
</script>
</body>
</html>
